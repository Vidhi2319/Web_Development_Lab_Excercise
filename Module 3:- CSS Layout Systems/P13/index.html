
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox vs Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
    </header>

    <!-- Flexbox Layout -->
    <section>
        <h2>Flexbox Layout</h2>

        <div class="flex-container">
            <div class="box">Home</div>
            <div class="box">About</div>
            <div class="box">Services</div>
        </div>
    </section>

    <!-- Grid Layout -->
    <section>
        <h2>Grid Layout</h2>

        <div class="grid-container">
            <div class="box">HTML</div>
            <div class="box">CSS</div>
            <div class="box">Java</div>
            <div class="box">Python</div>
            <div class="box">JavaScript</div>
            <div class="box">React</div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
