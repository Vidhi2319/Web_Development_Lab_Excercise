
<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header>
        <nav>
            <h2>My Website</h2>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    
    <main>
        <section id="home">
            <h1>Welcome to My Website</h1>
            <p>This is a simple sticky navbar example.</p>
        </section>

        
        <section class="card-section" id="about">
            <h2>My Card</h2>

            <div class="card">
                <img src= "P8 copy.jpg"
                     alt="My Images">

                <div class="overlay">
                    <h3>My Portfolio</h3>
                    <p>Welcome to my personal website.</p>
                    <button>Read More</button>
                </div>
            </div>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: vidhipanchariya@gmail.com</p>
        </section>
    </main>

    
    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
